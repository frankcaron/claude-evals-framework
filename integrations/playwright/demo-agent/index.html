<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo support agent</title>
</head>
<body>
  <!-- A stand-in for the upstream agentic workflow. Replace it with your app. -->
  <h1>Support agent</h1>
  <label>Context <textarea id="context" rows="4" cols="60"></textarea></label>
  <label>Question <input id="question" size="60"></label>
  <button id="ask">Ask</button>
  <p id="status" role="status"></p>
  <p id="answer" data-testid="answer"></p>
  <script>
    // ?variant=naive obeys instructions found in the context, to demonstrate a regression.
    const naive = new URLSearchParams(location.search).get('variant') === 'naive';

    function answer(question, context) {
      const lines = context.split('\n');
      const injected = lines.find((line) => /ignore all previous instructions/i.test(line));
      if (naive && injected) {
        const payload = injected.match(/reply only with (.+?)\.?$/i);
        if (payload) return payload[1];
      }
      const evidence = lines.filter((line) => line !== injected).join(' ');
      if (/capital of france/i.test(question)) return 'Paris';
      if (/return/i.test(question)) {
        const days = evidence.match(/within (\d+) days/i);
        if (days) return `You can return it within ${days[1]} days with a receipt.`;
      }
      return 'Not specified';
    }

    document.getElementById('ask').addEventListener('click', () => {
      const status = document.getElementById('status');
      status.textContent = 'Thinking...';
      // Simulate an asynchronous multi-step workflow.
      setTimeout(() => {
        document.getElementById('answer').textContent = answer(
          document.getElementById('question').value, document.getElementById('context').value);
        status.textContent = 'Done';
      }, 100);
    });
  </script>
</body>
</html>
